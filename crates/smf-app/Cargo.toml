[package]
name = "smf-app"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "smf-field"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
smf-geo.workspace = true
smf-tiles.workspace = true
smf-terrain.workspace = true
smf-render.workspace = true
smf-features.workspace = true
smf-io.workspace = true
smf-print.workspace = true
smf-data.workspace = true
smf-w3w.workspace = true
smf-ext.workspace = true
smf-route.workspace = true
smf-gps.workspace = true
smf-live.workspace = true
smf-sync.workspace = true
smf-net.workspace = true
web-time = "1"
eframe.workspace = true
anyhow.workspace = true
tracing.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
earcutr = "0.4"
serde_json.workspace = true
serde.workspace = true
crossbeam-channel = "0.5"

# Desktop only: files, native dialogs, logging to the terminal, opening links, the update check.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber.workspace = true
directories.workspace = true
rfd = "0.15"
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }

# Browser only: the glue to the page (canvas, storage, downloads, geolocation) and web GPU backends.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
rfd = "0.15"
wgpu = { version = "30", features = ["webgl", "webgpu"] }
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlCanvasElement", "Storage", "Navigator", "Geolocation",
    "Position", "PositionOptions", "PositionError", "Coordinates", "Blob", "BlobPropertyBag", "Url",
    "HtmlAnchorElement", "Element", "Location", "console",
] }

# Installer settings for cargo-packager (https://github.com/crabnebula-dev/cargo-packager).
# Configured but not yet exercised on clean machines; see README "Known limits".
[package.metadata.packager]
product-name = "ShowMeFire Field"
identifier = "org.showmefire.field"
description = "CalTopo-style mapping with Show Me Fire data"
authors = ["Central Crossing Fire Protection District"]
formats = ["nsis", "dmg", "appimage"]
