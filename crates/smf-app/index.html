<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ShowMeFire Field</title>
    <meta name="description" content="Mapping for fire and field operations with Show Me Fire data: basemaps, 3D terrain, drawing, GPS and team maps." />
    <meta name="theme-color" content="#1b1b1b" />
    <link data-trunk rel="rust" data-bin="smf-field" data-wasm-opt="s" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue --enable-simd" />
    <style>
      html, body { margin: 0; height: 100%; background: #1b1b1b; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #loading_text {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #bbb; font: 16px system-ui, sans-serif; padding: 24px; text-align: center; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="smf_canvas"></canvas>
    <div id="loading_text">Loading ShowMeFire Field...</div>
  </body>
</html>
